<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<meta name="description" content="A little birthday card, made with love.">
<meta name="theme-color" content="#1b0b1f">

<!-- The obscure URL is the only thing keeping this private: a Pages site is
     public whether or not the repo is. Keep it out of search results too. -->
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">

<meta property="og:title" content="Happy Birthday!">
<meta property="og:description" content="Tap to open your card.">
<meta property="og:type" content="website">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">

<style>
/* ============================================================
   PALETTE & TYPE
   ============================================================ */
:root{
  --ink:        #fff6f9;
  --ink-soft:   #f6d9e4;
  --ink-mute:   #d3a7bb;

  --bg-0:       #1b0b1f;
  --bg-1:       #2d0f33;
  --bg-2:       #47143f;

  --pink:       #ff5f9e;
  --coral:      #ff7a6b;
  --gold:       #ffc94d;
  --mint:       #4fe0c1;
  --lilac:      #b98cff;
  --cream:      #fff3e2;

  --card:       rgba(255,255,255,.06);
  --card-line:  rgba(255,255,255,.16);

  --display: "Segoe UI Rounded", ui-rounded, "SF Pro Rounded", "Nunito",
             "Trebuchet MS", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --hand: "Segoe Script", "Bradley Hand", "Brush Script MT", cursive;
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }

/* Any rule here that sets `display` outranks the browser's own
   [hidden]{display:none}, so hiding an element in JS would silently do
   nothing. Restate it with weight so `hidden` always wins. */
[hidden]{ display:none !important; }

body{
  margin:0;
  font-family:var(--body);
  color:var(--ink);
  background:
    radial-gradient(1100px 700px at 12% -10%, #6b1b52 0%, transparent 60%),
    radial-gradient(900px 700px at 92% 8%,  #3a1560 0%, transparent 58%),
    radial-gradient(900px 900px at 50% 115%, #7a2140 0%, transparent 62%),
    linear-gradient(160deg, var(--bg-1), var(--bg-0) 55%, var(--bg-2));
  background-attachment:fixed;
  min-height:100svh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

body::before{
  content:"";
  position:fixed; inset:-20%;
  background:
    radial-gradient(closest-side, rgba(255,95,158,.20), transparent) 18% 30%/38vmin 38vmin no-repeat,
    radial-gradient(closest-side, rgba(185,140,255,.18), transparent) 82% 22%/32vmin 32vmin no-repeat,
    radial-gradient(closest-side, rgba(79,224,193,.13), transparent) 62% 82%/40vmin 40vmin no-repeat;
  filter:blur(14px);
  animation:drift 26s ease-in-out infinite alternate;
  pointer-events:none;
  z-index:0;
}
@keyframes drift{ to{ transform:translate3d(2.5%,-2.5%,0) scale(1.08); } }

#confetti{
  position:fixed; inset:0;
  width:100%; height:100%;
  pointer-events:none;
  z-index:60;
}

.wrap{
  position:relative;
  z-index:10;
  max-width:820px;
  margin:0 auto;
  padding:clamp(20px,5vw,48px) clamp(18px,5vw,32px) 72px;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:clamp(20px,4vw,34px);
}

.scene{ text-align:center; }
.scene[hidden]{ display:none; }

.prompt{
  font-family:var(--display);
  font-size:clamp(1.05rem,3.6vw,1.5rem);
  font-weight:700;
  color:var(--ink-soft);
  margin:0 0 6px;
  text-wrap:balance;
}
.prompt-sub{
  font-size:clamp(.8rem,2.6vw,.95rem);
  color:var(--ink-mute);
  margin:0 0 clamp(18px,4vw,30px);
}
.prompt-sub kbd{
  font:inherit;
  background:rgba(255,255,255,.1);
  border:1px solid var(--card-line);
  border-radius:6px;
  padding:1px 6px;
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  appearance:none;
  font:inherit;
  font-family:var(--display);
  font-weight:700;
  font-size:.95rem;
  cursor:pointer;
  padding:12px 22px;
  border-radius:999px;
  border:1px solid var(--card-line);
  background:var(--card);
  color:var(--ink);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease, opacity .18s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn:hover{ transform:translateY(-2px); background:rgba(255,255,255,.13); box-shadow:0 10px 24px rgba(0,0,0,.3); }
.btn:active{ transform:translateY(0); }
.btn:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
.btn:disabled{ opacity:.5; cursor:default; transform:none; }
.btn.primary{
  background:linear-gradient(100deg,var(--pink),var(--coral));
  border-color:transparent;
  color:#2a0b1c;
}
.btn.ghost{
  background:none;
  border-color:transparent;
  color:var(--ink-mute);
  font-weight:600;
  font-size:.85rem;
  padding:8px 14px;
}
.btn.ghost:hover{ background:rgba(255,255,255,.07); box-shadow:none; }

.sound{
  position:fixed;
  top:14px; right:14px;
  z-index:70;
  width:42px; height:42px;
  display:grid; place-items:center;
  font-size:1.05rem;
  padding:0;
  border-radius:50%;
}

/* ============================================================
   SCENE 0 — the wrapped gift
   ============================================================ */
.gift-stage{
  display:inline-block;
  position:relative;
  cursor:pointer;
  border:0;
  background:none;
  padding:24px;
  -webkit-tap-highlight-color:transparent;
}
.gift-stage:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:20px; }

.gift{
  position:relative;
  width:clamp(180px,52vw,232px);
  margin:0 auto;
  animation:rattle 2.4s ease-in-out infinite;
  transform-origin:50% 100%;
  filter:drop-shadow(0 24px 34px rgba(0,0,0,.45));
}
@keyframes rattle{
  0%,58%,100%{ transform:rotate(0) translateY(0); }
  62%{ transform:rotate(-4deg) translateY(-6px); }
  66%{ transform:rotate(4deg)  translateY(-3px); }
  70%{ transform:rotate(-3deg) translateY(-5px); }
  74%{ transform:rotate(2deg)  translateY(0); }
  78%{ transform:rotate(0); }
}

.gift-body{
  height:clamp(120px,34vw,150px);
  border-radius:6px 6px 10px 10px;
  background:
    repeating-linear-gradient(45deg,
      rgba(255,255,255,.09) 0 12px, transparent 12px 24px),
    linear-gradient(165deg,var(--pink),#c9376f);
  position:relative;
}
.gift-lid{
  height:clamp(34px,9vw,42px);
  margin:0 -9px 4px;
  border-radius:8px;
  background:
    repeating-linear-gradient(45deg,
      rgba(255,255,255,.11) 0 12px, transparent 12px 24px),
    linear-gradient(165deg,#ff77ae,#d94a80);
  position:relative;
  transform-origin:50% 100%;
  z-index:2;
}
/* Vertical + horizontal ribbon */
.gift-body::after,
.gift-lid::after{
  content:"";
  position:absolute;
  left:50%; top:0; bottom:0;
  width:clamp(24px,7vw,32px);
  transform:translateX(-50%);
  background:linear-gradient(90deg,#e8b53c,var(--gold),#e8b53c);
}
.bow{
  position:absolute;
  left:50%; top:-6px;
  transform:translate(-50%,-58%);
  width:clamp(74px,21vw,96px);
  height:clamp(40px,11vw,50px);
  z-index:3;
}
.bow span{
  position:absolute;
  top:0;
  width:48%; height:100%;
  background:linear-gradient(160deg,var(--gold),#dda32c);
  border-radius:60% 40% 55% 45% / 70% 70% 30% 30%;
  box-shadow:inset 0 -4px 6px rgba(0,0,0,.15);
}
.bow span:first-child{ left:0;  transform:rotate(-22deg); }
.bow span:last-child { right:0; transform:rotate(22deg) scaleX(-1); }
.bow::after{
  content:"";
  position:absolute;
  left:50%; top:42%;
  width:22%; aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffe08a, #d9a12c);
}

.tag{
  position:absolute;
  right:-6px; bottom:14px;
  transform:rotate(7deg);
  background:var(--cream);
  color:#7a2a4d;
  font-family:var(--hand);
  font-size:clamp(.85rem,3vw,1rem);
  padding:8px 14px;
  border-radius:4px 10px 10px 4px;
  box-shadow:0 6px 14px rgba(0,0,0,.35);
  z-index:4;
  max-width:60%;
  line-height:1.25;
}

/* Opening */
.gift.opening{ animation:none; }
.gift.opening .gift-lid{
  animation:lidOff .85s cubic-bezier(.3,-0.3,.4,1) forwards;
}
@keyframes lidOff{
  to{ transform:translate(38%,-190px) rotate(38deg); opacity:0; }
}
.gift.opening .gift-body{
  animation:squash .85s cubic-bezier(.2,.9,.3,1) forwards;
}
@keyframes squash{
  30%{ transform:scale(1.1,.88); }
  100%{ transform:scale(.7,.5) translateY(40px); opacity:0; }
}
.gift.opening .bow,
.gift.opening .tag{ animation:flyOff .7s ease-in forwards; }
@keyframes flyOff{ to{ transform:translateY(-140px) rotate(50deg); opacity:0; } }

/* ============================================================
   SCENE 1 — the cake
   ============================================================ */
.cake-stage{
  display:inline-block;
  position:relative;
  padding:0 10px;
}
.cake-stage::before{
  content:"";
  position:absolute;
  left:50%; top:-14%;
  width:min(58vw,320px); aspect-ratio:1;
  transform:translateX(-50%);
  background:radial-gradient(closest-side, rgba(255,201,77,.42), transparent 72%);
  filter:blur(6px);
  opacity:var(--glow,1);
  transition:opacity .8s ease;
  pointer-events:none;
}

.candles{
  display:flex;
  justify-content:center;
  align-items:flex-end;
  gap:clamp(10px,3.4vw,20px);
  position:relative;
  z-index:2;
  margin-bottom:-2px;
}

.candle{
  appearance:none; background:none; border:0;
  padding:6px 4px 0;
  cursor:pointer;
  display:flex; flex-direction:column; align-items:center;
  -webkit-tap-highlight-color:transparent;
}
.candle:focus-visible{ outline:2px solid var(--gold); outline-offset:4px; border-radius:10px; }

.flame{
  width:13px; height:20px;
  border-radius:50% 50% 46% 46% / 68% 68% 32% 32%;
  background:radial-gradient(ellipse at 50% 78%, #fff8d8 0%, var(--gold) 38%, var(--coral) 74%, rgba(255,90,60,0) 100%);
  box-shadow:0 0 16px 5px rgba(255,180,60,.55);
  transform-origin:50% 100%;
  animation:flicker 1.05s ease-in-out infinite alternate;
  margin-bottom:3px;
}
@keyframes flicker{
  from{ transform:scale(1) rotate(-3deg); opacity:.92; }
  to  { transform:scale(1.14,1.2) rotate(3deg); opacity:1; }
}
/* While breath is detected, every flame leans hard */
.blowing .flame{ animation:lean .18s ease-in-out infinite alternate; }
@keyframes lean{
  from{ transform:rotate(-26deg) scale(.9,1.15); }
  to  { transform:rotate(-40deg) scale(.75,1.3); }
}

.wick{ width:2px; height:6px; background:#4a3a3a; border-radius:1px; }

.stick{
  width:11px;
  height:clamp(38px,9vw,54px);
  border-radius:4px 4px 2px 2px;
  background:repeating-linear-gradient(-58deg, var(--cream) 0 6px, var(--pink) 6px 12px);
  box-shadow:inset -3px 0 0 rgba(0,0,0,.16), 0 2px 5px rgba(0,0,0,.3);
}
.candle:nth-child(even) .stick{ background:repeating-linear-gradient(-58deg, var(--cream) 0 6px, var(--mint) 6px 12px); }
.candle:nth-child(3n) .stick{ background:repeating-linear-gradient(-58deg, var(--cream) 0 6px, var(--lilac) 6px 12px); }
.candle:hover .flame{ transform:scale(1.2); }

.candle.out .flame{
  animation:none; opacity:0;
  transform:translateY(-14px) scale(.3);
  box-shadow:none;
  transition:all .45s ease;
}
.candle.out .wick{ background:#2b2222; }

.smoke{
  position:absolute;
  width:9px; height:9px;
  border-radius:50%;
  background:rgba(230,220,225,.5);
  filter:blur(3px);
  pointer-events:none;
  animation:puff 1.5s ease-out forwards;
  z-index:3;
}
@keyframes puff{
  0%  { opacity:.65; transform:translate(-50%,0) scale(.5); }
  100%{ opacity:0;   transform:translate(-50%,-72px) scale(3.4); }
}

.cake{ position:relative; z-index:1; filter:drop-shadow(0 18px 26px rgba(0,0,0,.42)); }
.icing{
  width:clamp(200px,62vw,286px); height:26px; margin:0 auto;
  border-radius:14px 14px 8px 8px;
  background:linear-gradient(180deg,#fff6fa,#ffd9e8);
  position:relative;
}
.icing::after{
  content:"";
  position:absolute; left:0; right:0; top:20px; height:16px;
  background:radial-gradient(closest-side, #ffd9e8 96%, transparent) repeat-x 0 0/26px 30px;
}
.layer{
  width:clamp(190px,59vw,272px); margin:0 auto;
  height:clamp(46px,12vw,62px);
  background:linear-gradient(180deg,#c96a8d,#a44a70);
  position:relative;
}
.layer.two{
  width:clamp(216px,68vw,308px);
  background:linear-gradient(180deg,#b8577f,#8d3a5f);
  border-radius:0 0 12px 12px;
}
.layer::after{
  content:"";
  position:absolute; inset:0;
  background:
    radial-gradient(circle, var(--gold) 40%, transparent 42%) 18% 30%/34px 34px,
    radial-gradient(circle, var(--mint) 40%, transparent 42%) 62% 62%/40px 40px,
    radial-gradient(circle, var(--cream) 40%, transparent 42%) 84% 24%/46px 46px;
  opacity:.75;
}
.plate{
  width:clamp(250px,78vw,352px); height:14px; margin:0 auto;
  border-radius:0 0 50% 50%/0 0 100% 100%;
  background:linear-gradient(180deg,#e9dbe4,#a9909e);
}

.counter{
  margin-top:18px;
  font-size:.85rem;
  color:var(--ink-mute);
  letter-spacing:.06em;
  text-transform:uppercase;
  min-height:1.2em;
}

/* --- Breath meter --- */
.mic-row{
  margin-top:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}
.meter{
  width:min(260px,72vw);
  height:8px;
  border-radius:999px;
  background:rgba(255,255,255,.11);
  overflow:hidden;
  position:relative;
}
.meter::after{
  content:"";
  position:absolute; inset:0;
  left:calc(var(--trip,.6) * 100%);
  border-left:2px dashed rgba(255,255,255,.4);
}
.meter i{
  display:block; height:100%;
  width:calc(var(--level,0) * 100%);
  border-radius:999px;
  background:linear-gradient(90deg,var(--mint),var(--gold),var(--pink));
  transition:width .07s linear;
}
.mic-hint{
  font-size:.82rem;
  color:var(--ink-mute);
  min-height:1.2em;
  text-wrap:balance;
  max-width:34ch;
}

/* ============================================================
   SCENE 2 — the card
   ============================================================ */
.card-scene{
  display:none;
  flex-direction:column;
  gap:clamp(18px,4vw,28px);
  align-items:center;
  text-align:center;
}
.card-scene.show{ display:flex; }

.reveal{
  opacity:0;
  transform:translateY(26px) scale(.97);
  animation:rise .85s cubic-bezier(.2,.85,.3,1) forwards;
}
@keyframes rise{ to{ opacity:1; transform:none; } }

.headline{
  font-family:var(--display);
  font-weight:800;
  line-height:1.02;
  letter-spacing:-.02em;
  margin:0;
  font-size:clamp(2.3rem,10.5vw,4.4rem);
  text-wrap:balance;
  background:linear-gradient(105deg,var(--gold),var(--pink) 42%,var(--lilac) 78%,var(--mint));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 4px 16px rgba(255,95,158,.3));
}
.headline .name{ display:block; }

.age-badge{
  display:inline-flex; align-items:baseline; gap:.4em;
  padding:7px 16px;
  border-radius:999px;
  background:var(--card);
  border:1px solid var(--card-line);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(.85rem,3vw,1rem);
  color:var(--ink-soft);
}
.age-badge b{ font-size:1.35em; color:var(--gold); }

.photo-frame{
  position:relative;
  width:clamp(180px,52vw,236px);
  aspect-ratio:1;
  border-radius:50%;
  padding:7px;
  background:conic-gradient(from 210deg, var(--gold), var(--pink), var(--lilac), var(--mint), var(--gold));
  box-shadow:0 18px 40px rgba(0,0,0,.42);
  animation:bob 5.5s ease-in-out infinite alternate;
}
@keyframes bob{ to{ transform:translateY(-9px) rotate(1.6deg); } }

.photo-frame img,
.photo-fallback{
  width:100%; height:100%;
  border-radius:50%;
  object-fit:cover;
  display:block;
  background:linear-gradient(160deg,#5b2247,#33143a);
}
.photo-fallback{
  display:none;
  place-items:center;
  font-family:var(--display);
  font-weight:800;
  font-size:clamp(3rem,14vw,4.6rem);
  color:var(--ink-soft);
}
.photo-frame.no-photo img{ display:none; }
.photo-frame.no-photo .photo-fallback{ display:grid; }

/* A party hat perched on the top of the frame. It's one box holding a cone
   and a pom-pom, rotated about its base, so the whole thing tilts together
   and the base stays planted on her head. */
.hat{
  position:absolute;
  left:50%; top:-16%;
  width:clamp(48px,14vw,64px);
  height:clamp(56px,16vw,74px);
  transform:translateX(-62%) rotate(-17deg);
  transform-origin:50% 100%;
  pointer-events:none;
  z-index:2;
  filter:drop-shadow(0 5px 9px rgba(0,0,0,.4));
}
.hat::before{                       /* the cone, with candy stripes */
  content:"";
  position:absolute; inset:0;
  clip-path:polygon(50% 0, 100% 100%, 0 100%);
  background:
    repeating-linear-gradient(74deg,
      rgba(255,255,255,.34) 0 7px, transparent 7px 15px),
    linear-gradient(150deg, var(--pink), #d1447a);
}
.hat::after{                        /* the pom-pom, sat on the tip */
  content:"";
  position:absolute;
  left:50%; top:-11%;
  width:34%; aspect-ratio:1;
  transform:translate(-50%,-38%);
  border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #ffe9a8, var(--gold) 62%, #dda32c);
  box-shadow:0 0 13px rgba(255,201,77,.75);
}

.caption{
  margin:12px 0 0;
  font-family:var(--hand);
  font-size:clamp(1rem,3.4vw,1.2rem);
  color:var(--ink-mute);
}

.letter{
  width:100%; max-width:560px;
  padding:clamp(22px,5.5vw,34px);
  border-radius:22px;
  background:var(--card);
  border:1px solid var(--card-line);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
  box-shadow:0 22px 60px rgba(0,0,0,.34);
  text-align:left;
}
.letter p{
  margin:0 0 1.05em;
  font-size:clamp(1rem,3.4vw,1.12rem);
  line-height:1.72;
  color:var(--ink-soft);
  text-wrap:pretty;
}
.letter p:last-of-type{ margin-bottom:0; }
.letter .greeting{
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(1.15rem,4vw,1.35rem);
  color:var(--ink);
}
.signature{
  margin-top:22px; padding-top:18px;
  border-top:1px solid var(--card-line);
  font-family:var(--hand);
  font-size:clamp(1.25rem,4.6vw,1.6rem);
  color:var(--gold);
  text-align:right;
}

/* ============================================================
   NOW PLAYING
   ============================================================ */
.now-playing{
  width:100%;
  max-width:560px;
  padding:clamp(16px,4vw,22px);
  border-radius:22px;
  background:var(--card);
  border:1px solid var(--card-line);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
  box-shadow:0 22px 60px rgba(0,0,0,.34);
}
.np-label{
  margin:0 0 12px;
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(.95rem,3.2vw,1.1rem);
  color:var(--ink-soft);
  letter-spacing:.01em;
}
.now-playing iframe{
  display:block;
  width:100%;
  border:0;
  border-radius:14px;
  overflow:hidden;
  /* Both widgets are opaque, so give them something to sit on while they
     load rather than flashing a white rectangle on a dark page. */
  background:#181818;
}
.np-fallback{
  display:block;
  margin-top:12px;
  font-size:.82rem;
  color:var(--ink-mute);
  text-decoration:none;
  transition:color .18s ease;
}
.np-fallback:hover{ color:var(--gold); text-decoration:underline; }

/* ============================================================
   MEMORY GALLERY — polaroids
   ============================================================ */
.gallery-wrap{ width:100%; }
.gallery-title{
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(1rem,3.4vw,1.2rem);
  color:var(--ink-soft);
  margin:0 0 18px;
  letter-spacing:.01em;
}
.gallery{
  display:flex;
  gap:clamp(14px,4vw,26px);
  padding:14px clamp(14px,5vw,30px) 26px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  justify-content:safe center;
}
.gallery::-webkit-scrollbar{ display:none; }

.polaroid{
  flex:0 0 auto;
  scroll-snap-align:center;
  width:clamp(146px,42vw,178px);
  padding:11px 11px 0;
  background:linear-gradient(180deg,#fffdf8,#f2e7de);
  border-radius:3px;
  box-shadow:0 14px 30px rgba(0,0,0,.42);
  cursor:zoom-in;
  border:0;
  position:relative;
  /* Tilt comes from a custom property, set per polaroid in JS. It can't be
     nth-child: each one is wrapped in its own slot to hold the configured
     order while the images resolve, so they're all only-children. */
  transform:rotate(var(--tilt,0deg));
  transition:transform .28s cubic-bezier(.2,.9,.3,1), box-shadow .28s ease;
  -webkit-tap-highlight-color:transparent;
}
.polaroid:hover, .polaroid:focus-visible{
  transform:rotate(0) translateY(-10px) scale(1.05);
  box-shadow:0 22px 44px rgba(0,0,0,.5);
  z-index:2;
  outline:none;
}
.polaroid img{
  width:100%; aspect-ratio:1;
  object-fit:cover;
  display:block;
  background:#e3d6cc;
}
.polaroid .cap{
  display:block;
  font-family:var(--hand);
  font-size:.88rem;
  color:#6b4a5a;
  padding:9px 4px 12px;
  min-height:2.4em;
  line-height:1.3;
  text-wrap:balance;
}
/* Sticky-tape strip */
.polaroid::before{
  content:"";
  position:absolute;
  top:-10px; left:50%;
  transform:translateX(-50%) rotate(-3deg);
  width:52px; height:20px;
  background:rgba(255,247,214,.5);
  border-left:1px solid rgba(255,255,255,.35);
  border-right:1px solid rgba(255,255,255,.35);
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}

/* Lightbox */
.lightbox{
  position:fixed; inset:0;
  z-index:90;
  display:none;
  place-items:center;
  padding:24px;
  background:rgba(12,4,16,.9);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  cursor:zoom-out;
}
.lightbox.open{ display:grid; animation:fadeIn .25s ease; }
@keyframes fadeIn{ from{ opacity:0; } }
.lightbox img{
  max-width:min(92vw,760px);
  max-height:72svh;
  border-radius:10px;
  box-shadow:0 30px 70px rgba(0,0,0,.6);
  background:#2a1226;
}
.lightbox p{
  margin:18px 0 0;
  font-family:var(--hand);
  font-size:1.25rem;
  color:var(--ink-soft);
  text-align:center;
  text-wrap:balance;
}
.lightbox .close{
  position:absolute;
  top:16px; right:16px;
  width:44px; height:44px;
  border-radius:50%;
  display:grid; place-items:center;
  font-size:1.2rem;
  padding:0;
}

.actions{
  display:flex; flex-wrap:wrap; gap:12px; justify-content:center;
}

.foot{
  text-align:center;
  font-size:.78rem;
  color:rgba(255,255,255,.34);
  letter-spacing:.04em;
}

/* Toast for keepsake feedback */
.toast{
  position:fixed;
  left:50%; bottom:26px;
  transform:translate(-50%,140%);
  z-index:95;
  background:rgba(20,8,24,.94);
  border:1px solid var(--card-line);
  color:var(--ink-soft);
  padding:13px 20px;
  border-radius:14px;
  font-size:.9rem;
  max-width:min(90vw,420px);
  text-align:center;
  box-shadow:0 18px 40px rgba(0,0,0,.5);
  /* Empty, this box is short, so shifting it by its own height doesn't clear
     the viewport — it leaves a sliver stuck to the bottom edge. Hide it
     outright and let the transform handle only the motion. */
  opacity:0;
  visibility:hidden;
  transition:transform .38s cubic-bezier(.2,.9,.3,1), opacity .3s ease, visibility .38s;
  text-wrap:balance;
}
.toast.show{
  transform:translate(-50%,0);
  opacity:1;
  visibility:visible;
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
  .reveal{ opacity:1; transform:none; }
  .gift{ animation:none; }
}
</style>
</head>
<body>

<canvas id="confetti" aria-hidden="true"></canvas>

<button class="btn sound" id="soundBtn" type="button" aria-pressed="false" title="Sound on">🔈</button>

<main class="wrap">

  <!-- ---------- SCENE 0: the wrapped gift ---------- -->
  <section class="scene" id="scene0">
    <h1 class="prompt" id="prompt0">Something arrived for you…</h1>
    <p class="prompt-sub">Tap the box to open it</p>

    <button class="gift-stage" id="giftBtn" type="button" aria-label="Open the present">
      <div class="gift" id="gift">
        <span class="bow" aria-hidden="true"><span></span><span></span></span>

      </div>

    <p><button class="btn ghost" id="skipIntro" type="button">skip the wrapping →</button></p>
  </section>

  <section class="scene" id="scene1" hidden>

    <div class="mic-row">

  <!-- ---------- SCENE 2: the card ---------- -->
  <section class="card-scene" id="scene2" aria-hidden="true">

    <h1 class="headline reveal" style="animation-delay:.05s">
      Happy Birthday<span class="name" id="nameOut">!</span>
    </h1>

    <div class="reveal" style="animation-delay:.2s">
      <span class="age-badge" id="ageBadge" hidden></span>
    </div>

    <div class="reveal" style="animation-delay:.35s">
      <figure style="margin:0">
        <div class="photo-frame" id="photoFrame">
          <span class="hat" aria-hidden="true"></span>
          <img id="photo" alt="">
          <span class="photo-fallback" id="fallback" aria-hidden="true"></span>
        </div>
        <figcaption class="caption" id="caption"></figcaption>
      </figure>

    <div class="letter reveal" style="animation-delay:.5s">
      <p class="greeting" id="greetingOut"></p>

    </div>

    <div class="now-playing reveal" id="nowPlaying" style="animation-delay:.58s" hidden></div>

    <div class="gallery-wrap reveal" id="galleryWrap" style="animation-delay:.7s" hidden>
      <h2 class="gallery-title" id="galleryTitle"></h2>
      <div class="gallery" id="gallery"></div>
    </div>

    <div class="actions reveal" style="animation-delay:.72s">
      <button class="btn primary" type="button" id="moreConfetti">More confetti 🎉</button>
      <button class="btn" type="button" id="saveBtn">Save as a keepsake 📸</button>
      <button class="btn" type="button" id="replay">Light the candles again</button>

</main>

<!-- Lightbox for the gallery -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo">
  <button class="btn close" id="lightboxClose" type="button" aria-label="Close">✕</button>
  <div>
    <img id="lightboxImg" alt="">
    <p id="lightboxCap"></p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   ✏️  EDIT ME — everything personal lives in this one object.
   ══════════════════════════════════════════════════════════════ */
const CARD = {
  // Who it's for. Also overridable in the URL: index.html?to=Sophie
  name: "Birthday Girl",

  // Age shown in the little badge. null hides it.
  age: null,

  // How many candles on the cake (1–12 looks best).
  candles: 5,

  // Text on the gift tag in the opening scene.
  giftTag: "To you,\nopen me 💝",

  // The main photo. Drop your image at assets/photo.jpg.
  photo: "assets/photo.jpg",
  photoCaption: "Lisbon has my heart 🤍",

  // The message. Each string becomes its own paragraph.
  greeting: "Happy birthday!",
  message: [
    "Another trip around the sun, and somehow you keep getting better at it.",
    "Thank you for the laughs, the patience, and for being exactly who you are. The world is a warmer place with you in it.",
    "Here's to a year full of good news, good food, and everything you've been quietly hoping for."
  ],
  signature: "— with love",

  // ── MEMORY GALLERY ──────────────────────────────────────────
  // Drop photos in assets/ and list them here. Any that are
  // missing quietly disappear, so extras are harmless.
  galleryTitle: "a few favourites 📷",
  gallery: [
    { src: "assets/memory-1.jpg", caption: "minding mine 🐆" },
    { src: "assets/memory-2.jpg", caption: "red card 🔴" },
    { src: "assets/memory-3.jpg", caption: "" }
  ],

  // Tiny line at the very bottom. "" hides it.
  footer: "made just for you 💛",

  // ── HER SONG ────────────────────────────────────────────────
  song: {
    title: "Runaway",
    artist: "Kanye West",
    label: "her song 🎧",

    // Which player to embed: "apple" or "spotify". Both are official
    // embeds — nothing to host, nothing to infringe, artwork included, and
    // the artist gets paid. She taps play; no browser autoplays a song.
    provider: "apple",

    // From a music.apple.com link: .../album/<album>?i=<track>
    appleMusic: { album: "1445865909", track: "1445866473", country: "gb" },

    // From a Spotify track link, the last path segment.
    spotify: "3DK6m7It6Pw857FcQftMds",

    // Prefer your own audio file? Put it in assets/, name it here, and it
    // plays inline on loop through the 🔊 toggle instead of the embed.
    // Only publish a file you have the rights to — see the README.
    file: "",

    // Sparse single piano note over the candle scene, before the song.
    tease: true
  }
};
/* ══════════════════════════════════════════════════════════════
   Below here is the machinery. You shouldn't need to touch it.
   ══════════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const nameFromUrl = new URLSearchParams(location.search).get("to");
const NAME = (nameFromUrl || CARD.name || "").trim();

/* ---------- Populate ---------- */
document.title = NAME ? `Happy Birthday, ${NAME}!` : "Happy Birthday!";
$("nameOut").textContent = NAME ? `${NAME}!` : "!";
$("prompt0").textContent = NAME ? `Something arrived for you, ${NAME}…` : "Something arrived for you…";
$("prompt1").textContent = NAME ? `Make a wish, ${NAME}…` : "Make a wish…";
$("giftTag").textContent = CARD.giftTag;
$("giftTag").style.whiteSpace = "pre-line";

if (CARD.age != null){
  const badge = $("ageBadge");
  badge.hidden = false;
  badge.innerHTML = `<b>${CARD.age}</b> looks good on you`;
}

$("greetingOut").textContent = CARD.greeting;
$("bodyOut").innerHTML = CARD.message.map(p => `<p>${p}</p>`).join("");
$("signOut").textContent = CARD.signature;
$("caption").textContent = CARD.photoCaption;
$("footOut").textContent = CARD.footer;

/* ---------- Main photo, with a graceful fallback ---------- */
const frame = $("photoFrame");
const photo = $("photo");
let photoReady = false;
$("fallback").textContent = (NAME[0] || "🎂").toUpperCase();
photo.alt = NAME ? `A photo of ${NAME}` : "Birthday photo";
photo.addEventListener("load",  () => { photoReady = true; });
photo.addEventListener("error", () => frame.classList.add("no-photo"));
photo.src = CARD.photo;

/* ---------- Little helpers ---------- */
function buzz(pattern){
  if (reduceMotion) return;
  try { navigator.vibrate?.(pattern); } catch {}
}

let toastTimer = null;
function toast(msg, ms = 3400){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}

/* ══════════════════════════════════════════════════════════════
   PARTICLES — confetti, streamers and fireworks share one canvas
   ══════════════════════════════════════════════════════════════ */
const canvas = $("confetti");
const ctx = canvas.getContext("2d");
const COLORS = ["#ff5f9e","#ffc94d","#4fe0c1","#b98cff","#ff7a6b","#fff3e2"];

let pieces  = [];   // confetti rectangles
let rockets = [];   // firework shells on the way up
let sparks  = [];   // firework burst particles
let raf = null;

function sizeCanvas(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = innerWidth  * dpr;
  canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeCanvas();
addEventListener("resize", sizeCanvas);

function start(){ if (!raf) raf = requestAnimationFrame(tick); }

function spawn(count, originX, originY, spread){
  if (reduceMotion) count = Math.min(count, 24);
  for (let i = 0; i < count; i++){
    const angle = -Math.PI/2 + (Math.random() - .5) * spread;
    const speed = 7 + Math.random() * 13;
    pieces.push({
      x: originX, y: originY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      w: 6 + Math.random() * 7,
      h: 9 + Math.random() * 9,
      rot: Math.random() * Math.PI * 2,
      spin: (Math.random() - .5) * .3,
      color: COLORS[(Math.random() * COLORS.length) | 0],
      ribbon: Math.random() < .3,
      life: 0
    });
  }
  start();
}

/* The classic two-cannon burst. */
function cannons(){
  spawn(90, innerWidth * .04, innerHeight * .96, 1.0);
  spawn(90, innerWidth * .96, innerHeight * .96, 1.0);
  setTimeout(() => spawn(70, innerWidth * .5, innerHeight * .55, 2.6), 220);
}

function launchFireworks(n = 5){
  if (reduceMotion) n = Math.min(n, 2);
  for (let i = 0; i < n; i++){
    setTimeout(() => {
      rockets.push({
        x: innerWidth * (.14 + Math.random() * .72),
        y: innerHeight + 12,
        vx: (Math.random() - .5) * 1.2,
        vy: -(10 + Math.random() * 3.5),
        targetY: innerHeight * (.13 + Math.random() * .3),
        color: COLORS[(Math.random() * COLORS.length) | 0]
      });
      start();
    }, i * 420 + Math.random() * 160);
  }
}

function burst(r){
  const n = reduceMotion ? 24 : 74;
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const s = 1.6 + Math.random() * 5.4;
    sparks.push({
      x: r.x, y: r.y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      color: Math.random() < .25 ? "#fff3e2" : r.color,
      life: 0,
      maxLife: 55 + Math.random() * 40
    });
  }
  popSound();
  buzz(18);
}

function tick(){
  ctx.clearRect(0, 0, innerWidth, innerHeight);

  /* --- confetti --- */
  for (let i = pieces.length - 1; i >= 0; i--){
    const p = pieces[i];
    p.life++;
    p.vy += 0.24;          // gravity
    p.vx *= 0.992;         // drag
    p.vy *= 0.992;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.spin;

    if (p.y > innerHeight + 60 || p.life > 700){ pieces.splice(i, 1); continue; }

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life > 560 ? 1 - (p.life - 560) / 140 : 1;
    if (p.ribbon) ctx.fillRect(-p.w/2, -p.h/2, p.w * Math.abs(Math.cos(p.rot)), p.h);
    else          ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx.restore();
  }

  /* --- rockets --- */
  ctx.globalCompositeOperation = "lighter";
  for (let i = rockets.length - 1; i >= 0; i--){
    const r = rockets[i];
    r.vy += 0.06;
    r.x += r.vx;
    r.y += r.vy;

    ctx.globalAlpha = 1;
    ctx.fillStyle = r.color;
    ctx.beginPath();
    ctx.arc(r.x, r.y, 2.6, 0, Math.PI * 2);
    ctx.fill();
    // a short glowing tail
    ctx.globalAlpha = .3;
    ctx.fillRect(r.x - 1.2, r.y, 2.4, 14);

    if (r.y <= r.targetY || r.vy >= -1.2){ burst(r); rockets.splice(i, 1); }
  }

  /* --- sparks --- */
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.life++;
    s.vy += 0.055;
    s.vx *= 0.972;
    s.vy *= 0.972;
    s.x += s.vx;
    s.y += s.vy;

    if (s.life > s.maxLife){ sparks.splice(i, 1); continue; }

    ctx.globalAlpha = Math.max(0, 1 - s.life / s.maxLife);
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 2.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;

  if (pieces.length || rockets.length || sparks.length){
    raf = requestAnimationFrame(tick);
  } else {
    raf = null;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
  }
}

/* ══════════════════════════════════════════════════════════════
   SOUND — generated with WebAudio, so there's no file to host.
   ══════════════════════════════════════════════════════════════ */
let audioCtx = null;
let soundOn = false;
const soundBtn = $("soundBtn");

function ac(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

/* A single piano note, struck softly and left to ring. Used for the sparse
   tease over the candle scene — one repeated pitch, nothing more. */
function pianoNote(c, semi, startAt, dur = 2.6){
  const freq = 440 * Math.pow(2, semi / 12);
  const gain = c.createGain();
  gain.gain.setValueAtTime(0.0001, startAt);
  gain.gain.exponentialRampToValueAtTime(0.16, startAt + 0.008);   // hammer
  gain.gain.exponentialRampToValueAtTime(0.0001, startAt + dur);   // long decay

  // A couple of quiet partials give it body without sounding like a beep.
  [[1, 1], [2, 0.28], [3, 0.1]].forEach(([mult, level]) => {
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = "triangle";
    osc.frequency.value = freq * mult;
    g.gain.value = level;
    osc.connect(g).connect(gain);
    osc.start(startAt);
    osc.stop(startAt + dur + 0.1);
  });

  gain.connect(c.destination);
}

/* The tease: one note, repeating, while the candles are still lit. */
let teaseTimer = null;
function startTease(){
  if (!CARD.song?.tease || !soundOn || teaseTimer) return;
  const strike = () => {
    if (!soundOn || scene1.hidden) return stopTease();
    pianoNote(ac(), 7);            // E5
  };
  strike();
  teaseTimer = setInterval(strike, 2000);
}
function stopTease(){
  clearInterval(teaseTimer);
  teaseTimer = null;
}

/* Filtered noise — used for the candle puff and firework pops. */
function noiseBurst({ freq = 900, dur = 0.3, vol = 0.25, type = "bandpass" } = {}){
  if (!soundOn || !audioCtx) return;
  const c = audioCtx;
  const len = Math.max(1, Math.floor(c.sampleRate * dur));
  const buf = c.createBuffer(1, len, c.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);

  const src = c.createBufferSource();
  src.buffer = buf;
  const filter = c.createBiquadFilter();
  filter.type = type;
  filter.frequency.value = freq;
  const g = c.createGain();
  g.gain.setValueAtTime(vol, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);

  src.connect(filter).connect(g).connect(c.destination);
  src.start();
}

const blowSound = () => noiseBurst({ freq: 900, dur: .3,  vol: .25 });
const popSound  = () => noiseBurst({ freq: 260, dur: .45, vol: .3, type: "lowpass" });

soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? "🔊" : "🔈";
  soundBtn.setAttribute("aria-pressed", String(soundOn));
  soundBtn.title = soundOn ? "Mute" : "Sound on";

  if (soundOn){
    ac();                                  // this tap is the unlock gesture
    if (!scene1.hidden) startTease();
    if (localTrack) localTrack.play().catch(() => {});
  } else {
    stopTease();
    localTrack?.pause();
    audioCtx?.suspend();
  }
});

/* ══════════════════════════════════════════════════════════════
   HER SONG
   Two ways to play it, and the config decides which:

   song.file     an audio file you host yourself. Plays inline, loops, and
                 rides the 🔊 toggle. Only legal to publish if you have the
                 rights — a ripped commercial track on a public Pages site
                 is distribution, so this is left empty by default.

   song.spotify  an official Spotify embed. Nothing to host, nothing to
                 infringe, the artist gets paid, and it shows the artwork.
                 She taps play in the widget; browsers won't autoplay it.
   ══════════════════════════════════════════════════════════════ */
let localTrack = null;

function setupLocalTrack(){
  if (!CARD.song?.file) return;
  localTrack = new Audio(CARD.song.file);
  localTrack.loop = true;
  localTrack.preload = "auto";
  localTrack.volume = 0.75;
  localTrack.addEventListener("error", () => {
    console.warn("Song file missing:", CARD.song.file);
    localTrack = null;
    buildPlayer();                         // fall back to the embed
  });
}

/* Each provider returns the iframe src, the height its player wants, and a
   plain link for when the embed is blocked or there's no signal. */
const PLAYERS = {
  apple(song){
    const { album, track, country = "us" } = song.appleMusic || {};
    if (!album) return null;
    const q = track ? `?i=${track}&theme=dark` : "?theme=dark";
    return {
      src: `https://embed.music.apple.com/${country}/album/${album}${q}`,
      height: 175,
      link: `https://music.apple.com/${country}/album/${album}${track ? `?i=${track}` : ""}`,
      // Apple's embed needs these to reach its own storage and to hand off
      // to the Apple Music app when she taps through.
      sandbox: "allow-forms allow-popups allow-same-origin allow-scripts " +
               "allow-storage-access-by-user-activation " +
               "allow-top-navigation-by-user-activation",
      allow: "autoplay *; encrypted-media *;"
    };
  },
  spotify(song){
    if (!song.spotify) return null;
    return {
      src: `https://open.spotify.com/embed/track/${song.spotify}?utm_source=generator&theme=0`,
      height: 152,
      link: `https://open.spotify.com/track/${song.spotify}`,
      sandbox: null,
      allow: "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    };
  }
};

let playerBuilt = false;
function buildPlayer(){
  const song = CARD.song;
  const host = $("nowPlaying");
  if (!song || !host || playerBuilt) return;

  const make = PLAYERS[song.provider] || PLAYERS.apple;
  const cfg = make(song) || PLAYERS.spotify(song);   // fall back if unconfigured
  if (!cfg) return;

  playerBuilt = true;
  host.innerHTML = "";
  // Unhide before the iframe goes in. An iframe created inside a
  // display:none subtree may not start loading until it's revealed, and
  // that delay is visible as a dead grey box on the biggest moment.
  host.hidden = false;

  const label = document.createElement("p");
  label.className = "np-label";
  label.textContent = song.label || "her song 🎧";
  host.appendChild(label);

  // Built here rather than sitting in the HTML, so the music service isn't
  // contacted at all until the card is actually opened.
  const frame = document.createElement("iframe");
  frame.src = cfg.src;
  frame.width = "100%";
  frame.height = String(cfg.height);
  frame.allow = cfg.allow;
  frame.loading = "eager";
  frame.style.height = cfg.height + "px";
  frame.title = `${song.title} — ${song.artist}`;
  if (cfg.sandbox) frame.setAttribute("sandbox", cfg.sandbox);
  host.appendChild(frame);

  const link = document.createElement("a");
  link.className = "np-fallback";
  link.href = cfg.link;
  link.target = "_blank";
  link.rel = "noopener";
  link.textContent = `${song.title} — ${song.artist} ↗`;
  host.appendChild(link);
}

function startSong(){
  if (localTrack){
    if (soundOn) localTrack.play().catch(() => {});
  } else {
    buildPlayer();
  }
}

setupLocalTrack();

/* ══════════════════════════════════════════════════════════════
   CANDLES
   ══════════════════════════════════════════════════════════════ */
const candleBox = $("candles");
const stage = $("cakeStage");
const counter = $("counter");
const TOTAL = Math.max(1, Math.min(12, CARD.candles | 0));
let lit = TOTAL;
let cardOpened = false;

function buildCandles(){
  candleBox.innerHTML = "";
  lit = TOTAL;
  cardOpened = false;
  stage.style.setProperty("--glow", "1");
  updateCounter();

  for (let i = 0; i < TOTAL; i++){
    const b = document.createElement("button");
    b.className = "candle";
    b.type = "button";
    b.setAttribute("aria-label", `Blow out candle ${i + 1}`);
    b.innerHTML = `<span class="flame"></span><span class="wick"></span><span class="stick"></span>`;
    b.addEventListener("click", () => blowOut(b));
    candleBox.appendChild(b);
  }
}

function updateCounter(){
  counter.textContent = lit > 0 ? `${lit} candle${lit === 1 ? "" : "s"} still lit` : "";
}

function blowOut(btn){
  if (!btn || btn.classList.contains("out")) return;
  btn.classList.add("out");
  btn.disabled = true;
  lit--;

  // Smoke puff over the candle that just went out
  const r = btn.getBoundingClientRect();
  const s = stage.getBoundingClientRect();
  const puff = document.createElement("span");
  puff.className = "smoke";
  puff.style.left = (r.left - s.left + r.width / 2) + "px";
  puff.style.top  = (r.top  - s.top) + "px";
  stage.appendChild(puff);
  setTimeout(() => puff.remove(), 1600);

  blowSound();
  buzz(28);
  stage.style.setProperty("--glow", String(lit / TOTAL));
  updateCounter();

  if (lit === 0 && !cardOpened){
    cardOpened = true;
    buzz([40, 60, 40, 60, 120]);
    setTimeout(openCard, 620);
  }
}

const nextLitCandle = () => candleBox.querySelector(".candle:not(.out)");

addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("lightbox").classList.contains("open")){ closeLightbox(); return; }
  if (scene1.hidden) return;
  if (e.code !== "Space" && e.code !== "Enter") return;
  if (document.activeElement?.classList.contains("candle")) return; // let the button handle it
  const next = nextLitCandle();
  if (next){ e.preventDefault(); blowOut(next); }
});

/* ══════════════════════════════════════════════════════════════
   BREATH DETECTION — listen to the mic and look for a real puff.
   Breath is broadband, low-frequency-heavy noise, which is what
   separates it from speech or a TV in the background.
   ══════════════════════════════════════════════════════════════ */
const micBtn   = $("micBtn");
const micHint  = $("micHint");
const meter    = $("meter");
const meterFill= $("meterFill");

let micStream = null;
let micRaf = null;

async function enableMic(){
  if (!isSecureContext || !navigator.mediaDevices?.getUserMedia){
    micBtn.disabled = true;
    micHint.textContent = "Blowing needs the hosted (https) version — for now, just tap the candles.";
    return;
  }

  micBtn.disabled = true;
  micHint.textContent = "Asking for the microphone…";

  try{
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
  }catch{
    micBtn.disabled = false;
    micHint.textContent = "No microphone this time — tapping the candles works just as well.";
    return;
  }

  const c = ac();
  const source = c.createMediaStreamSource(micStream);
  const analyser = c.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0.55;
  source.connect(analyser);      // deliberately NOT connected to the speakers

  const time = new Uint8Array(analyser.fftSize);
  const freq = new Uint8Array(analyser.frequencyBinCount);
  const nyquist = c.sampleRate / 2;
  const lowCut = Math.floor((800 / nyquist) * analyser.frequencyBinCount);

  // Listen to the room for a moment so a noisy kitchen doesn't trip it.
  let ambient = 0;
  const calibrateUntil = performance.now() + 1200;
  let threshold = 0.06;
  let calibrating = true;

  meter.hidden = false;
  micBtn.textContent = "🎤 Listening…";
  micHint.textContent = "Hold still for a second while I listen to the room…";

  let overSince = 0;
  let lastBlow = 0;

  function loop(){
    analyser.getByteTimeDomainData(time);
    analyser.getByteFrequencyData(freq);

    // RMS level from the waveform
    let sum = 0;
    for (let i = 0; i < time.length; i++){
      const v = (time[i] - 128) / 128;
      sum += v * v;
    }
    const rms = Math.sqrt(sum / time.length);

    // How much of the energy sits below ~800 Hz
    let low = 0, all = 0;
    for (let i = 0; i < freq.length; i++){
      all += freq[i];
      if (i < lowCut) low += freq[i];
    }
    const lowRatio = all > 0 ? low / all : 0;

    const now = performance.now();

    if (calibrating){
      ambient = Math.max(ambient, rms);
      if (now > calibrateUntil){
        calibrating = false;
        threshold = Math.min(0.28, Math.max(0.055, ambient * 2.6));
        micBtn.textContent = "🎤 Now blow!";
        micHint.textContent = "Hold your phone close and blow — like you mean it.";
        meter.style.setProperty("--trip", String(Math.min(1, threshold / 0.35)));
      }
    } else {
      const blowing = rms > threshold && lowRatio > 0.5;

      if (blowing){
        if (!overSince) overSince = now;
        stage.classList.add("blowing");
        // Sustained for 140ms? Start snuffing them, one every 240ms.
        if (now - overSince > 140 && now - lastBlow > 240){
          lastBlow = now;
          const next = nextLitCandle();
          if (next) blowOut(next);
        }
      } else {
        overSince = 0;
        stage.classList.remove("blowing");
      }
    }

    meterFill.style.setProperty("--level", String(Math.min(1, rms / 0.35)));

    if (lit > 0 && !scene1.hidden) micRaf = requestAnimationFrame(loop);
    else stopMic();
  }

  micRaf = requestAnimationFrame(loop);
}

function stopMic(){
  cancelAnimationFrame(micRaf);
  micRaf = null;
  micStream?.getTracks().forEach(t => t.stop());
  micStream = null;
  stage.classList.remove("blowing");
  meter.hidden = true;
  micBtn.disabled = false;
  micBtn.textContent = "🎤 Blow them out for real";
  micHint.textContent = "";
}

micBtn.addEventListener("click", enableMic);

/* ══════════════════════════════════════════════════════════════
   MEMORY GALLERY
   ══════════════════════════════════════════════════════════════ */
const galleryWrap = $("galleryWrap");
const galleryEl = $("gallery");

const TILTS = ["-2.6deg", "2.2deg", "1.2deg", "-1.8deg", "3deg"];

function buildGallery(){
  const shots = (CARD.gallery || []).filter(g => g && g.src);
  if (!shots.length) return;

  $("galleryTitle").textContent = CARD.galleryTitle || "";

  // Slots keep the configured order even though the images resolve out of it.
  const slots = shots.map(() => {
    const slot = document.createElement("span");
    slot.style.display = "contents";
    galleryEl.appendChild(slot);
    return slot;
  });

  shots.forEach((shot, i) => {
    // Probe with a detached image. It must not be `loading="lazy"` and must
    // not live inside the hidden gallery while it loads: a lazy image in a
    // display:none subtree never intersects the viewport, so the browser
    // never fetches it, so it never reports back — and the polaroid waiting
    // on it would stay hidden forever.
    const probe = new Image();
    probe.decoding = "async";

    probe.addEventListener("load", () => {
      const fig = document.createElement("button");
      fig.className = "polaroid";
      fig.type = "button";
      fig.style.setProperty("--tilt", TILTS[i % TILTS.length]);
      fig.setAttribute("aria-label", shot.caption || `Photo ${i + 1}`);

      const img = document.createElement("img");
      img.src = shot.src;                    // already cached by the probe
      img.alt = shot.caption || "";

      const cap = document.createElement("span");
      cap.className = "cap";
      cap.textContent = shot.caption || "";

      fig.append(img, cap);
      fig.addEventListener("click", () => openLightbox(shot.src, shot.caption || ""));

      slots[i].appendChild(fig);
      galleryWrap.hidden = false;
    });

    // A missing file just leaves its slot empty.
    probe.addEventListener("error", () => slots[i].remove());
    probe.src = shot.src;
  });
}
buildGallery();

/* --- Lightbox --- */
const lightbox = $("lightbox");
function openLightbox(src, caption){
  $("lightboxImg").src = src;
  $("lightboxImg").alt = caption;
  $("lightboxCap").textContent = caption;
  lightbox.classList.add("open");
}
function closeLightbox(){
  lightbox.classList.remove("open");
  $("lightboxImg").src = "";
}
lightbox.addEventListener("click", closeLightbox);
$("lightboxClose").addEventListener("click", closeLightbox);

/* ══════════════════════════════════════════════════════════════
   KEEPSAKE — paint a shareable portrait image on a canvas.
   Drawn by hand rather than screenshotting the DOM, so there's
   no library to load and the output is a clean 1080×1350.
   ══════════════════════════════════════════════════════════════ */
function wrapText(c, text, maxWidth){
  const words = String(text).split(/\s+/);
  const lines = [];
  let line = "";
  for (const w of words){
    const test = line ? line + " " + w : w;
    if (c.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function drawKeepsake(){
  const W = 1080, H = 1350;
  const k = document.createElement("canvas");
  k.width = W; k.height = H;
  const c = k.getContext("2d");

  // Background, echoing the page
  const bg = c.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, "#2d0f33");
  bg.addColorStop(.55, "#1b0b1f");
  bg.addColorStop(1, "#47143f");
  c.fillStyle = bg;
  c.fillRect(0, 0, W, H);

  for (const [x, y, r, col] of [
    [W*.12, H*.06, 520, "rgba(107,27,82,.75)"],
    [W*.94, H*.14, 460, "rgba(58,21,96,.7)"],
    [W*.5,  H*1.0, 560, "rgba(122,33,64,.6)"]
  ]){
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, col);
    g.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
  }

  // Scattered confetti
  for (let i = 0; i < 150; i++){
    c.save();
    c.translate(Math.random() * W, Math.random() * H);
    c.rotate(Math.random() * Math.PI);
    c.globalAlpha = .16 + Math.random() * .5;
    c.fillStyle = COLORS[(Math.random() * COLORS.length) | 0];
    c.fillRect(0, 0, 9 + Math.random() * 9, 14 + Math.random() * 12);
    c.restore();
  }
  c.globalAlpha = 1;

  // Photo in a gradient ring
  const cx = W / 2, cy = 400, R = 210;
  const ring = c.createConicGradient
    ? c.createConicGradient(Math.PI * 1.2, cx, cy)
    : c.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  ring.addColorStop(0, "#ffc94d");
  ring.addColorStop(.3, "#ff5f9e");
  ring.addColorStop(.6, "#b98cff");
  ring.addColorStop(.85, "#4fe0c1");
  ring.addColorStop(1, "#ffc94d");
  c.fillStyle = ring;
  c.beginPath(); c.arc(cx, cy, R + 12, 0, Math.PI * 2); c.fill();

  c.save();
  c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.clip();
  if (photoReady && photo.naturalWidth){
    // cover-crop, centred
    const s = Math.max((R*2) / photo.naturalWidth, (R*2) / photo.naturalHeight);
    const dw = photo.naturalWidth * s, dh = photo.naturalHeight * s;
    c.drawImage(photo, cx - dw/2, cy - dh/2, dw, dh);
  } else {
    c.fillStyle = "#5b2247";
    c.fillRect(cx - R, cy - R, R*2, R*2);
    c.fillStyle = "#f6d9e4";
    c.font = `800 190px ${"'Segoe UI', system-ui, sans-serif"}`;
    c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText((NAME[0] || "🎂").toUpperCase(), cx, cy + 8);
  }
  c.restore();

  // Headline
  c.textAlign = "center";
  c.textBaseline = "alphabetic";
  const head = c.createLinearGradient(120, 0, W - 120, 0);
  head.addColorStop(0, "#ffc94d");
  head.addColorStop(.45, "#ff5f9e");
  head.addColorStop(.8, "#b98cff");
  head.addColorStop(1, "#4fe0c1");

  c.fillStyle = "#f6d9e4";
  c.font = `700 54px ${"'Segoe UI', system-ui, sans-serif"}`;
  c.fillText("Happy Birthday", cx, 730);

  c.fillStyle = head;
  let nameSize = 108;
  c.font = `800 ${nameSize}px ${"'Segoe UI', system-ui, sans-serif"}`;
  while (c.measureText(NAME).width > W - 160 && nameSize > 44){
    nameSize -= 6;
    c.font = `800 ${nameSize}px ${"'Segoe UI', system-ui, sans-serif"}`;
  }
  c.fillText(NAME || "🎂", cx, 730 + nameSize + 18);

  // A line or two of the message
  let y = 730 + nameSize + 110;
  c.fillStyle = "rgba(246,217,228,.92)";
  c.font = `400 34px ${"'Segoe UI', system-ui, sans-serif"}`;
  const body = [CARD.greeting, ...CARD.message].join("  ");
  const lines = wrapText(c, body, W - 220).slice(0, 5);
  for (const line of lines){
    c.fillText(line, cx, y);
    y += 52;
  }

  // Signature
  c.fillStyle = "#ffc94d";
  c.font = `italic 400 44px ${"Georgia, 'Segoe Script', serif"}`;
  c.fillText(CARD.signature, cx, Math.min(y + 56, H - 90));

  if (CARD.footer){
    c.fillStyle = "rgba(255,255,255,.4)";
    c.font = `400 24px ${"'Segoe UI', system-ui, sans-serif"}`;
    c.fillText(CARD.footer, cx, H - 46);
  }

  return k;
}

$("saveBtn").addEventListener("click", async () => {
  const btn = $("saveBtn");
  btn.disabled = true;
  try{
    const k = drawKeepsake();
    const blob = await new Promise((res, rej) =>
      k.toBlob(b => b ? res(b) : rej(new Error("no blob")), "image/png"));

    const filename = `happy-birthday-${(NAME || "you").toLowerCase().replace(/[^a-z0-9]+/g, "-")}.png`;
    const file = new File([blob], filename, { type: "image/png" });

    // Share sheet on phones, plain download everywhere else
    if (navigator.canShare?.({ files: [file] })){
      await navigator.share({ files: [file], title: document.title });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast("Saved! Check your downloads 💛");
    }
  }catch(err){
    if (err?.name === "AbortError"){ /* user dismissed the share sheet */ }
    else if (err?.name === "SecurityError")
      toast("Saving needs the hosted version — the photo blocks it when opened straight off the disk.");
    else
      toast("Couldn't save the image on this browser, sorry!");
  }finally{
    btn.disabled = false;
  }
});

/* ══════════════════════════════════════════════════════════════
   SCENES
   ══════════════════════════════════════════════════════════════ */
const scene0 = $("scene0");
const scene1 = $("scene1");
const scene2 = $("scene2");

function showCake(){
  scene0.hidden = true;
  scene1.hidden = false;
  scene1.style.animation = "rise .6s cubic-bezier(.2,.85,.3,1) both";
  startTease();
}

let unwrapping = false;
function unwrap(){
  if (unwrapping) return;
  unwrapping = true;
  $("gift").classList.add("opening");
  $("giftBtn").disabled = true;
  buzz([20, 40, 30]);
  popSound();
  spawn(70, innerWidth / 2, innerHeight * .52, 2.4);
  setTimeout(showCake, reduceMotion ? 120 : 800);
}

$("giftBtn").addEventListener("click", unwrap);
$("skipIntro").addEventListener("click", (e) => { e.stopPropagation(); showCake(); });

function openCard(){
  stopMic();
  stopTease();
  scene1.style.transition = "opacity .5s ease, transform .5s ease";
  scene1.style.opacity = "0";
  scene1.style.transform = "scale(.94)";

  setTimeout(() => {
    scene1.hidden = true;
    scene2.classList.add("show");
    scene2.setAttribute("aria-hidden", "false");

    cannons();
    setTimeout(() => launchFireworks(5), 900);

    startSong();

    // Nudge the sound button if she hasn't found it — only meaningful when
    // there are sounds of ours to unmute; the Spotify widget has its own.
    if (localTrack && !soundOn) soundBtn.animate(
      [{transform:"scale(1)"},{transform:"scale(1.25)"},{transform:"scale(1)"}],
      {duration:600, iterations:3}
    );
  }, 480);
}

$("moreConfetti").addEventListener("click", () => { cannons(); launchFireworks(3); buzz(20); });

$("replay").addEventListener("click", () => {
  scene2.classList.remove("show");
  scene2.setAttribute("aria-hidden", "true");
  scene1.hidden = false;
  scene1.style.opacity = "1";
  scene1.style.transform = "none";
  buildCandles();
  scene1.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
});

buildCandles();
</script>
